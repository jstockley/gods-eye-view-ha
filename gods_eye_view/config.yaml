name: "God's Eye View"
version: "0.1.5"
slug: "gods_eye_view"
description: "Live 3D spatial intelligence globe — aircraft, ships, satellites, CCTV and more, on a photorealistic globe."
url: "https://github.com/jstockley/gods-eye-view-ha"
arch:
  - aarch64
  - amd64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: "mdi:earth"
panel_title: "God's Eye View"

# Every installer supplies their own keys — the app brokers all of them
# server-side, but none can be baked into a public image. All are optional
# except google_maps_api_key / cesium_ion_token (need at least one for 3D).
# Names match the upstream .env.example / README key table.
options:
  google_maps_api_key: ""
  cesium_ion_token: ""
  openai_api_key: ""
  aisstream_api_key: ""
  firms_map_key: ""
  tomtom_api_key: ""
  opensky_auth_mode: "anon"
  ratelimit_openai_per_min: 20
  ratelimit_google_per_min: 60
  log_level: "info"
  default_postcode: ""
  default_zoom_m: 600

schema:
  google_maps_api_key: str?
  cesium_ion_token: str?
  openai_api_key: str?
  aisstream_api_key: str?
  firms_map_key: str?
  tomtom_api_key: str?
  opensky_auth_mode: "list(anon|oauth)"
  ratelimit_openai_per_min: int
  ratelimit_google_per_min: int
  log_level: "list(info|debug)"
  default_postcode: str?
  default_zoom_m: int?

# Persists the generated .env (and any Vite/CesiumJS caches) across
# add-on restarts and updates.
map:
  - "addon_config:rw"
